---

bluemap_enabled: true

bluemap_identifier: bluemap
bluemap_base_path: "/{{ bluemap_identifier }}"
bluemap_config_path: "{{ bluemap_base_path }}/config"
bluemap_data_path: "{{ bluemap_base_path }}/data"
bluemap_web_path: "{{ bluemap_base_path }}/web"

# renovate: datasource=docker depName=ghcr.io/bluemap-minecraft/bluemap versioning=semver
bluemap_version: v5.28

bluemap_uid: ""
bluemap_gid: ""

# The hostname at which BlueMap is served.
bluemap_hostname: ""

# The path at which BlueMap is served.
# This value must either be `/` or not end with a slash (e.g. `/bluemap`).
bluemap_path_prefix: /

bluemap_container_image: "{{ bluemap_container_image_registry_prefix }}bluemap-minecraft/bluemap:{{ bluemap_container_image_tag }}"
bluemap_container_image_tag: "{{ bluemap_version }}"
bluemap_container_image_registry_prefix: "{{ bluemap_container_image_registry_prefix_upstream }}"
bluemap_container_image_registry_prefix_upstream: "{{ bluemap_container_image_registry_prefix_upstream_default }}"
bluemap_container_image_registry_prefix_upstream_default: ghcr.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
bluemap_container_network: "{{ bluemap_identifier }}"

# Control if the container network is deleted on uninstalling.
bluemap_container_network_deletion_enabled: true

# When true, disabling BlueMap (`bluemap_enabled: false`) also deletes the
# generated data under `bluemap_data_path` (rendered maps) and
# `bluemap_web_path` (web assets). The configuration under
# `bluemap_config_path` is never deleted automatically and must be removed
# manually. This is destructive and defaults to false.
bluemap_force_uninstall_cleanup: false

# Specify how the container publishes its HTTP port (as defined by `bluemap_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:8100"), or empty string to not expose.
bluemap_container_http_host_bind_port: ""

# The port number that BlueMap's built-in webserver listens on inside the container,
# which is what the port publishing above and the Traefik labels below are pointed at.
bluemap_container_http_port: 8100

# Accept Mojang's resource download upfront ("accept-download" in BlueMap's
# `config/core.conf`). BlueMap refuses to fetch the textures it needs until this
# is true; defaults to false to match BlueMap's own zero-consent root config.
bluemap_accept_download: false

# The worlds to render, each as `{"name": <name>, "path": <host path>}`.
# Each world is mounted read-only at `/app/<name>`, which is where BlueMap's
# default map configuration looks for them.
#
# `bluemap_worlds_auto` is defined by the playbook wiring in
# `templates/group_vars_mash_servers` (currently: the worlds of the Minecraft service).
bluemap_worlds: "{{ bluemap_worlds_auto + bluemap_worlds_custom }}"
bluemap_worlds_auto: []
bluemap_worlds_custom: []

# Subset of `bluemap_worlds` that the systemd service actually mounts.
# Docker refuses to bind-mount a missing path, so installation narrows this to
# the worlds whose host directory exists by then (Minecraft creates world
# folders lazily). Worlds appearing later are picked up by the next run.
bluemap_worlds_existing: "{{ bluemap_worlds }}"

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
bluemap_container_additional_networks: "{{ bluemap_container_additional_networks_auto + bluemap_container_additional_networks_custom }}"
bluemap_container_additional_networks_auto: []
bluemap_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container, beyond the
# config/data/web directories and the worlds above.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}`.
# See the `--mount` documentation for the `docker run` command.
bluemap_container_additional_volumes: []

# bluemap_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `bluemap_container_labels_additional_labels_custom`.
bluemap_container_labels_traefik_enabled: true
bluemap_container_labels_traefik_docker_network: "{{ bluemap_container_network }}"
bluemap_container_labels_traefik_hostname: "{{ bluemap_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/bluemap`).
bluemap_container_labels_traefik_path_prefix: "{{ bluemap_path_prefix }}"
bluemap_container_labels_traefik_rule: "Host(`{{ bluemap_container_labels_traefik_hostname }}`){% if bluemap_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ bluemap_container_labels_traefik_path_prefix }}`){% endif %}"
bluemap_container_labels_traefik_priority: 0
bluemap_container_labels_traefik_entrypoints: web-secure
bluemap_container_labels_traefik_tls: "{{ bluemap_container_labels_traefik_entrypoints != 'web' }}"
bluemap_container_labels_traefik_tls_certResolver: default  # noqa var-naming
bluemap_container_labels_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
bluemap_container_labels_traefik_middleware_basic_auth_users: ""

# bluemap_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `bluemap_container_labels_additional_labels_custom`
#
# Example:
# bluemap_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
bluemap_container_labels_additional_labels: "{{ bluemap_container_labels_additional_labels_auto + bluemap_container_labels_additional_labels_custom }}"
bluemap_container_labels_additional_labels_auto: []
bluemap_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
bluemap_container_extra_arguments: "{{ bluemap_container_extra_arguments_auto + bluemap_container_extra_arguments_custom }}"
bluemap_container_extra_arguments_auto: []
bluemap_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container.
# BlueMap renders (`-r`), keeps the maps up-to-date (`-u`) and serves the webapp (`-w`).
bluemap_process_extra_arguments: "{{ bluemap_process_extra_arguments_auto + bluemap_process_extra_arguments_custom }}"
bluemap_process_extra_arguments_auto:
  - -r
  - -u
  - -w
bluemap_process_extra_arguments_custom: []

# List of systemd services that the BlueMap systemd service depends on
bluemap_systemd_required_services_list: "{{ bluemap_systemd_required_services_list_default + bluemap_systemd_required_services_list_auto + bluemap_systemd_required_services_list_custom }}"
bluemap_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
bluemap_systemd_required_services_list_auto: []
bluemap_systemd_required_services_list_custom: []

# List of systemd services that the BlueMap systemd service wants
bluemap_systemd_wanted_services_list: "{{ bluemap_systemd_wanted_services_list_default + bluemap_systemd_wanted_services_list_auto + bluemap_systemd_wanted_services_list_custom }}"
bluemap_systemd_wanted_services_list_default: []
bluemap_systemd_wanted_services_list_auto: []
bluemap_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
bluemap_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
bluemap_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
bluemap_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
bluemap_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ bluemap_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ bluemap_container_stop_grace_time_seconds }} {{ bluemap_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ bluemap_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ bluemap_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ bluemap_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ bluemap_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ bluemap_identifier }} after {{ bluemap_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify the timezone
bluemap_environment_variables_tz: UTC

# Additional environment variables.
bluemap_environment_variables_additional_variables: ""

# bluemap_restart_necessary controls whether the BlueMap systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
bluemap_restart_necessary: false
