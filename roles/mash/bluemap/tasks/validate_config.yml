---
- name: Fail if required BlueMap settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - bluemap_uid
    - bluemap_gid
    - bluemap_hostname
    - bluemap_path_prefix
    - bluemap_container_network

- name: Fail if no world to render is configured
  ansible.builtin.fail:
    msg: >-
      BlueMap has no world to render. Set `bluemap_worlds_custom` to a list of worlds
      (e.g. `bluemap_worlds_custom: [{name: world, path: /srv/minecraft/world}]`),
      or enable the `minecraft` role, which BlueMap picks up automatically.
  when: bluemap_worlds | length == 0

- name: Run if Traefik is enabled
  when: bluemap_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for BlueMap are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "bluemap_container_labels_traefik_hostname", when: true }
        - { "name": "bluemap_container_labels_traefik_path_prefix", when: true }
        - { "name": "bluemap_container_labels_traefik_middleware_basic_auth_users", when: "{{ bluemap_container_labels_traefik_middleware_basic_auth_enabled }}" }

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `bluemap_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if bluemap_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          bluemap_container_labels_traefik_path_prefix (`{{ bluemap_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/bluemap`).
      when: "bluemap_container_labels_traefik_path_prefix != '/' and bluemap_container_labels_traefik_path_prefix[-1] == '/'"
